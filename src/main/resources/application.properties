spring.application.name=emotion-friend
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}
spring.datasource.url=${EF_DB_URL:jdbc:postgresql://localhost:5432/emotion_friend}
spring.datasource.username=${EF_DB_USERNAME:emotion_friend}
spring.datasource.password=${EF_DB_PASSWORD:}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.mvc.log-request-details=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
emotion-friend.idempotency.fingerprint-key=${EF_IDEMPOTENCY_FINGERPRINT_KEY:}
emotion-friend.idempotency.encryption-key=${EF_IDEMPOTENCY_ENCRYPTION_KEY:}
emotion-friend.auth.signing-key=${EF_JWT_SIGNING_KEY:}
emotion-friend.auth.issuer=emotion-friend
emotion-friend.auth.audience=emotion-friend-adult
emotion-friend.bootstrap-admin.enabled=${EF_BOOTSTRAP_ADMIN_ENABLED:false}
emotion-friend.mail.enabled=${EF_MAIL_ENABLED:false}
emotion-friend.mail.api-key=${EF_RESEND_API_KEY:}
emotion-friend.mail.from=${EF_MAIL_FROM:}
emotion-friend.mail.frontend-base-url=${EF_FRONTEND_BASE_URL:}
emotion-friend.mail.scheduling-enabled=true
springdoc.api-docs.enabled=${EF_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${EF_API_DOCS_ENABLED:true}
springdoc.show-actuator=true
springdoc.paths-to-match=/api/v1/**,/actuator/health,/actuator/health/liveness
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Local migration adapter: disabled until deployment owner supplies a separate server-only token.
emotion-friend.agent.enabled=${EF_AGENT_ENABLED:false}
emotion-friend.agent.url=${EF_AGENT_URL:http://127.0.0.1:5198}
emotion-friend.agent.token=${EF_AGENT_SERVICE_TOKEN:}
emotion-friend.agent.v2-enabled=${EF_AGENT_V2:false}
emotion-friend.prototype.live-enabled=${EF_PROTOTYPE_LIVE_ENABLED:false}
emotion-friend.prototype.publication-enabled=${EF_PROTOTYPE_PUBLICATION_ENABLED:false}
emotion-friend.agent.model=${EF_AGENT_MODEL:gpt-5.4}
emotion-friend.agent.configuration-ref=${EF_AGENT_CONFIGURATION_REF:prototype-st-v2.1-ko4}
emotion-friend.prototype.test-clock-enabled=${EF_PROTOTYPE_TEST_CLOCK_ENABLED:false}
emotion-friend.prototype.max-calls=${EF_AGENT_MAX_CALLS:85}
emotion-friend.prototype.max-input-tokens=${EF_AGENT_MAX_INPUT_TOKENS:250000}
emotion-friend.prototype.max-output-tokens=${EF_AGENT_MAX_OUTPUT_TOKENS:32000}
emotion-friend.prototype.max-cost-microusd=${EF_AGENT_MAX_COST_MICROUSD:2000000}
emotion-friend.prototype.input-usd-per-million=${EF_AGENT_INPUT_USD_PER_MILLION:0}
emotion-friend.prototype.output-usd-per-million=${EF_AGENT_OUTPUT_USD_PER_MILLION:0}

# Legacy default remains deny; the isolated demo explicitly enables a short lease.
emotion-friend.core.lease-seconds=${EF_CORE_LEASE_SECONDS:0}
